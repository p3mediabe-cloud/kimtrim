# Florida Coffee demo → GitHub Pages
# Etkinleştirme (tek sefer): Settings → Pages → Source: "GitHub Actions";
# Settings → Environments → github-pages → Deployment branches: bu dalı ekle.
name: florida-demo-pages
on:
  push:
    branches: [claude/florida-coffee-web-mobile-analysis-mgqj71]
    paths: [docs/florida-coffee/dist/**, .github/workflows/florida-demo-pages.yml]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/florida-coffee/dist
      - id: deployment
        uses: actions/deploy-pages@v4
