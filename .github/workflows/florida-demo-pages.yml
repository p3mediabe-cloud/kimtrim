# Florida Coffee demo → GitHub Pages
# Etkinleştirme (tek sefer): Settings → Pages → Source: "GitHub Actions";
# Settings → Environments → github-pages → Deployment branches: bu dalı ekle.
name: florida-demo-pages
on:
  push:
    branches: [claude/florida-coffee-web-mobile-analysis-mgqj71]
    paths: [docs/florida-coffee/dist/**, docs/florida-coffee/site/**, docs/florida-coffee/demo-site/index.html, .github/workflows/florida-demo-pages.yml]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Proje sitesi /kimtrim/ altında yayınlanır; bağlantılar bu ön ekle üretilir
      - run: python3 docs/florida-coffee/site/build.py --base /kimtrim --out "$RUNNER_TEMP/pages"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/pages
      - id: deployment
        uses: actions/deploy-pages@v4
